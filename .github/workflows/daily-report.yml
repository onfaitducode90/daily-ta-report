name: Daily TA Report

# Runs report generation on GitHub's servers instead of a local machine, so
# a local internet/power outage can never produce an "OFFLINE MODE" report
# again.
#
# Target wall-clock times are 07:00 and 13:30 America/Los_Angeles (Pacific),
# year-round -- but GitHub Actions cron is plain UTC with no DST awareness,
# so a single fixed UTC offset would drift by an hour every spring/fall.
# Fixed by scheduling BOTH the PDT- and PST-equivalent UTC time for each
# target (4 triggers/weekday total), then the `gate` job below checks the
# actual current Pacific time via zoneinfo (which is DST-correct) and only
# lets `report` proceed if it's really within a few minutes of 07:00 or
# 13:30 Pacific. On any given day, exactly one of the four triggers passes
# the gate; the other three are a no-op (gate job only, seconds of cost).
#
# Triggers are offset 7 minutes past each target rather than sitting on
# the hour/half-hour: GitHub's own docs warn that `schedule` runs are
# delayed most at the top of every hour (the most common cron time, so
# the busiest queue), and a same-day trigger sitting exactly on :00/:30
# went unfired for over an hour on 2026-08-11. The 15-min gate tolerance
# below easily absorbs a 7-min offset.
#
# Each target also gets two extra triggers a few minutes later (+10, +13)
# rather than just one at +7. GitHub's `schedule` event is best-effort and
# can be silently DROPPED, not just delayed -- on 2026-08-12 the single
# +7 trigger never fired at all (no run of any kind appears in the
# history), so no report was generated that morning. Three independent
# cron evaluations per target, all still inside the 15-min gate window,
# make an all-three-dropped morning much less likely without adding any
# real cost: a skipped trigger only runs the ~5s `gate` job.
on:
  schedule:
    - cron: '7 14 * * 1-5'    # 07:07 PDT (roughly mid-Mar to early Nov)
    - cron: '10 14 * * 1-5'   # 07:10 PDT
    - cron: '13 14 * * 1-5'   # 07:13 PDT
    - cron: '7 15 * * 1-5'    # 07:07 PST (roughly early Nov to mid-Mar)
    - cron: '10 15 * * 1-5'   # 07:10 PST
    - cron: '13 15 * * 1-5'   # 07:13 PST
    - cron: '37 20 * * 1-5'   # 13:37 PDT
    - cron: '40 20 * * 1-5'   # 13:40 PDT
    - cron: '43 20 * * 1-5'   # 13:43 PDT
    - cron: '37 21 * * 1-5'   # 13:37 PST
    - cron: '40 21 * * 1-5'   # 13:40 PST
    - cron: '43 21 * * 1-5'   # 13:43 PST
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check Pacific wall-clock target
        id: check
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/Los_Angeles"))
          targets = [(7, 0), (13, 30)]
          minutes_now = now.hour * 60 + now.minute
          # 15 min tolerance -- GitHub's own docs note scheduled runs can be
          # delayed under load, and this stays well clear of the ~60 min gap
          # to the OTHER (wrong-DST) cron trigger's target.
          close = any(abs(minutes_now - (h * 60 + m)) <= 15 for h, m in targets)
          print(f"should_run={'true' if close else 'false'}")
          EOF

  report:
    needs: gate
    if: needs.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Drive token from secret
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          mkdir -p logs
          printf '%s' "$DRIVE_TOKEN_JSON" > logs/drive_token.json

      - name: Restore persistent state from Drive
        run: python state_sync.py --restore

      - name: Restore option chain data from Drive
        run: python optionchain_sync.py --restore

      - name: Generate report
        env:
          TA_OPTION_CHAIN_DIR: ${{ github.workspace }}/optionchain
        run: python daily_ta_report.py

      - name: Persist state back to Drive
        if: always()
        run: python state_sync.py --persist
