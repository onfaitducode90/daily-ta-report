name: Daily TA Report

# Runs report generation on GitHub's servers instead of a local machine, so
# a local internet/power outage can never produce an "OFFLINE MODE" report
# again.
#
# No target wall-clock time and no gate job: the exact time of day the
# report runs doesn't matter (daily_ta_report.py's own get_run_mode()
# labels the report morning/intraday/evening from whatever time it
# actually runs, so there's nothing for this workflow to get right or
# wrong about timing). What matters is that a report gets generated once
# per weekday, cloud-only, without depending on this machine being on or
# online.
#
# GitHub's `schedule` trigger for this (public) repo has proven unreliable
# on both axes that matter here:
#   - Delayed: every schedule-triggered run so far has fired 2-4 hours
#     late (verified 2026-08-12 -- see git history for the investigation).
#   - Dropped: a single trigger went completely unfired on 2026-08-11.
# Three triggers 15 minutes apart, all pointed at the same rough target,
# make an all-three-dropped day unlikely without adding real cost -- this
# repo is public, so Actions minutes are unlimited, and the report/Drive
# upload is idempotent by (date, mode) filename, so if more than one of
# the three actually fires, the later one just overwrites the same file
# rather than creating a duplicate.
on:
  schedule:
    - cron: '7 14 * * 1-5'
    - cron: '22 14 * * 1-5'
    - cron: '37 14 * * 1-5'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Drive token from secret
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          mkdir -p logs
          printf '%s' "$DRIVE_TOKEN_JSON" > logs/drive_token.json

      - name: Restore persistent state from Drive
        run: python state_sync.py --restore

      - name: Restore option chain data from Drive
        run: python optionchain_sync.py --restore

      - name: Generate report
        env:
          TA_OPTION_CHAIN_DIR: ${{ github.workspace }}/optionchain
        run: python daily_ta_report.py

      - name: Persist state back to Drive
        if: always()
        run: python state_sync.py --persist
